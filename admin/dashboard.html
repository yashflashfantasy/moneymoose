  <script>
    (function () {
      const sidebar = document.getElementById('sidebar');
      if (localStorage.getItem('sidebar-collapsed') === 'true') sidebar.classList.add('collapsed');
      document.getElementById('toggle-btn').addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        localStorage.setItem('sidebar-collapsed', sidebar.classList.contains('collapsed'));
      });
    })();

    (function startCommandClock() {
      const DAYS  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const MONTH = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      function getState(ist) {
        const day  = ist.getDay();
        const mins = ist.getHours() * 60 + ist.getMinutes();
        const isWE = day === 0 || day === 6;

        if (isWE) {
          const dayName = day === 6 ? 'Saturday' : 'Sunday';
          return { mode:'weekend', label: dayName.toUpperCase(), dotCls:'sdot-closed',
            countdown: 'Next session <strong>Mon 9:20 AM IST</strong>' };
        }
        if (mins < 560) {
          const left = 560 - mins;
          const h = Math.floor(left/60), m = left % 60;
          return { mode:'premarket', label:'PRE-MARKET', dotCls:'sdot-pre',
            countdown: `Opens in <strong>${h > 0 ? h + 'h ' : ''}${String(m).padStart(2,'0')}m</strong>` };
        }
        if (mins < 910) {
          const left = 910 - mins;
          const h = Math.floor(left/60), m = left % 60;
          return { mode:'open', label:'MARKET OPEN', dotCls:'sdot-open',
            countdown: `Closes in <strong>${h > 0 ? h + 'h ' : ''}${String(m).padStart(2,'0')}m</strong>` };
        }
        return { mode:'closed', label:'MARKET CLOSED', dotCls:'sdot-closed',
          countdown: 'Next session <strong>9:20 AM IST</strong>' };
      }

      function tick() {
        const ist = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));

        // Digits
        const h = String(ist.getHours()).padStart(2,'0');
        const m = String(ist.getMinutes()).padStart(2,'0');
        const s = String(ist.getSeconds()).padStart(2,'0');
        const digEl = document.getElementById('cmd-digits');
        if (digEl) digEl.textContent = `${h}:${m}:${s}`;

        // Date string
        const dtEl = document.getElementById('cmd-date-str');
        if (dtEl) dtEl.textContent = `${DAYS[ist.getDay()]}, ${ist.getDate()} ${MONTH[ist.getMonth()]} ${ist.getFullYear()}`;

        const st = getState(ist);

        // Digit color class
        if (digEl) {
          digEl.className = 'cmd-clock-digits ' + (
            st.mode === 'open'      ? 'state-open'   :
            st.mode === 'premarket' ? 'state-pre'     : 'state-closed'
          );
        }

        // Dot
        const dotEl = document.getElementById('cmd-sdot');
        if (dotEl) dotEl.className = `cmd-sdot ${st.dotCls}`;

        // Status label
        const lblEl = document.getElementById('cmd-slabel');
        if (lblEl) lblEl.textContent = st.label;

        // Countdown
        const cdEl = document.getElementById('cmd-countdown');
        if (cdEl) cdEl.innerHTML = st.countdown;

        // Market-live class on watchlist cards
        document.querySelectorAll('.wl-card[data-key]').forEach(card => {
          if (st.mode === 'open') card.classList.add('market-live');
          else                    card.classList.remove('market-live');
        });
      }

      tick();
      setInterval(tick, 1000);
    })();

    (function startLivePnL() {
      const card    = document.getElementById('live-pnl-card');
      const tbody   = document.getElementById('live-pnl-body');
      const updated = document.getElementById('live-pnl-updated');

      function isMarketHours() {
        const ist  = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
        const day  = ist.getDay();
        const mins = ist.getHours() * 60 + ist.getMinutes();
        return day !== 0 && day !== 6 && mins >= 560 && mins < 910;
      }

      async function fetchPositions() {
        if (!isMarketHours()) return [];
        const clients = (globalThis.linked_clients || []).filter(c => c.active);
        const all = [];
        await Promise.all(clients.map(async c => {
          try {
            const res = await api(`/clients/${c.id}/positions`);
            (res.data || []).forEach(p => all.push({ ...p, clientName: c.client_name }));
          } catch {}
        }));
        return all;
      }

      function fmt(n) { return Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

      async function render() {
        const positions = await fetchPositions();
        if (!positions.length) { card.style.display = 'none'; return; }
        card.style.display = '';
        tbody.innerHTML = positions.map(p => {
          const pnl    = p.pnl;
          const pnlPct = p.avg_price ? ((p.ltp - p.avg_price) / p.avg_price * 100) : null;
          const color  = pnl == null ? '#64748b' : pnl >= 0 ? '#16a34a' : '#dc2626';
          const sign   = pnl >= 0 ? '+' : '';
          return `<tr>
            <td class="fw-semibold">${p.trading_symbol}</td>
            <td>${p.qty}</td>
            <td>₹${fmt(p.avg_price)}</td>
            <td class="fw-bold">${p.ltp != null ? '₹' + fmt(p.ltp) : '<span class="text-muted">—</span>'}</td>
            <td style="color:${color};font-weight:700">${pnl != null ? sign + '₹' + fmt(Math.abs(pnl)) : '—'}</td>
            <td style="color:${color};font-weight:600">${pnlPct != null ? sign + pnlPct.toFixed(2) + '%' : '—'}</td>
          </tr>`;
        }).join('');
        updated.textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
      }

      // Wait for linked_clients to load then start
      const waitForClients = setInterval(() => {
        if (globalThis.linked_clients) { clearInterval(waitForClients); render(); setInterval(render, 30000); }
      }, 500);
    })();
  </script>
