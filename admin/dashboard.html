<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Dashboard — MoneyMoose</title>
  <link href="../assets/img/favicon.png" rel="icon">
  <link href="../assets/img/apple-touch-icon.png" rel="apple-touch-icon">
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body>

   <!-- Header -->
  <header>
    <div class="d-flex align-items-center">
      <a href="dashboard.html" class="logo d-flex align-items-center me-3">
        <!-- Uncomment the line below if you also wish to use an image logo -->
        <!-- <img src="assets/img/logo.webp" alt=""> -->
        <img src="../assets/img/logo-icon-1.png" alt="" width="60" class="logo-res">
         
        <h1 class="sitename">MoneyMoose</h1>
      </a>
      <button class="btn btn-sm btn-outline-secondary me-3" id="toggle-btn">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="position-relative pos-top-20">
        <div class="search-box">
          <i class="fa-solid fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search by name, symbol, or ISIN..." autocomplete="off">
        </div>
        <div id="resultsContainer" class="results"></div>
      </div>
      
    </div>
    <div class="dropdown">
      <a href="#" class="d-flex align-items-center text-dark text-decoration-none dropdown-toggle" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        <img src="../assets/img/person/person-f-3.webp" alt="Profile" class="rounded-circle me-2 d-md-block d-none" width="35" height="35">
        <span class="fw-semibold">Admin</span>
      </a>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
        <!-- <li><a class="dropdown-item" href="#">Profile</a></li>
        <li><a class="dropdown-item" href="#">Settings</a></li> -->
        <!-- <li><hr class="dropdown-divider"></li> -->
        <li><a class="dropdown-item" href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
      </ul>
    </div>
  </header>
  <!-- Sidebar -->
  <div id="sidebar">
    
    <nav class="nav flex-column mt-3">
      <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i> <span>Dashboard</span></a>
      <!-- <a href="#" class="nav-link"><i class="fa-solid fa-users"></i> <span>Users</span></a> -->
      <a href="report.html" class="nav-link"><i class="fa-solid fa-table-list"></i> <span>Reports</span></a>
      <a href="client.html" class="nav-link"><i class="fa-solid fa-users"></i> <span>Client</span></a>
      <a href="orders.html" class="nav-link"><i class="fa-solid fa-receipt"></i> <span>Orders</span></a>
      <a href="auto-trader.html" class="nav-link"><i class="fa-solid fa-robot"></i> <span>Auto Trader</span></a>
      <a href="login.html" class="nav-link"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
    </nav>
  </div>

 

  <!-- Main Content -->
  <div class="main-body">

    <!-- ── Command Center Clock Bar ──────────────────────────── -->
    <div class="cmd-clock-bar mb-3">
      <div class="cmd-clock-left">
        <span id="cmd-digits" class="cmd-clock-digits state-closed">00:00:00</span>
        <div class="cmd-clock-sub">
          <span id="cmd-date-str" class="cmd-date-str">—</span>
          <span class="cmd-tz-badge">IST</span>
        </div>
      </div>
      <div class="cmd-vdivider"></div>
      <div class="cmd-session-block">
        <div class="cmd-session-row">
          <span id="cmd-sdot" class="cmd-sdot sdot-closed"></span>
          <span id="cmd-slabel" class="cmd-slabel">Loading…</span>
        </div>
        <div id="cmd-countdown" class="cmd-countdown">—</div>
      </div>
    </div>

    <!-- ── Adaptive Context Panel ──────────────────────────────── -->
    <div id="adaptive-canvas" class="mb-3" aria-live="polite"></div>

    <!-- ── Call Options (CE) ─────────────────────────────────── -->
    <div class="wl-section wl-section-ce mb-3">
      <div class="wl-section-hd">
        <div class="wl-hd-left">
          <i class="fa-solid fa-arrow-trend-up wl-hd-icon"></i>
          <span class="wl-hd-title">Call Options</span>
          <span class="wl-hd-badge wl-badge-ce">CE</span>
        </div>
        <div class="wl-hd-right">
          <label class="wl-selall-lbl">
            <input type="checkbox" class="select-all-ce"> Select All
          </label>
          <button class="wl-hdr-btn" id="refresh-all-ce">
            <i class="bi bi-arrow-clockwise"></i> Refresh
          </button>
        </div>
      </div>
      <!-- Skeleton cards while loading -->
      <div id="callTableBody" class="wl-cards">
        <div class="wl-card" style="opacity:.35;pointer-events:none">
          <div class="wl-card-cb"></div>
          <div class="wl-card-body">
            <div class="mb-1"><span class="skel-cell" style="width:220px;height:15px"></span></div>
            <div><span class="skel-cell" style="width:140px"></span></div>
          </div>
          <div class="wl-price-col"><span class="skel-cell" style="width:70px;height:24px;border-radius:6px"></span></div>
          <div class="wl-actions-col"><span class="skel-cell" style="width:200px;height:36px;border-radius:10px"></span></div>
        </div>
      </div>
    </div>

    <!-- ── Put Options (PE) ──────────────────────────────────── -->
    <div class="wl-section wl-section-pe mb-3">
      <div class="wl-section-hd">
        <div class="wl-hd-left">
          <i class="fa-solid fa-arrow-trend-down wl-hd-icon"></i>
          <span class="wl-hd-title">Put Options</span>
          <span class="wl-hd-badge wl-badge-pe">PE</span>
        </div>
        <div class="wl-hd-right">
          <label class="wl-selall-lbl">
            <input type="checkbox" class="select-all-pe"> Select All
          </label>
          <button class="wl-hdr-btn" id="refresh-all-pe">
            <i class="bi bi-arrow-clockwise"></i> Refresh
          </button>
        </div>
      </div>
      <div id="putTableBody" class="wl-cards">
        <div class="wl-card" style="opacity:.35;pointer-events:none">
          <div class="wl-card-cb"></div>
          <div class="wl-card-body">
            <div class="mb-1"><span class="skel-cell" style="width:200px;height:15px"></span></div>
            <div><span class="skel-cell" style="width:130px"></span></div>
          </div>
          <div class="wl-price-col"><span class="skel-cell" style="width:70px;height:24px;border-radius:6px"></span></div>
          <div class="wl-actions-col"><span class="skel-cell" style="width:200px;height:36px;border-radius:10px"></span></div>
        </div>
      </div>
    </div>

    <!-- Client Health Score strip -->
    <div id="client-health-strip" class="mb-3">
      <div class="chs-strip">
        <div class="chs-card" style="opacity:.4"><div class="chs-top"><span class="skel-cell" style="width:70px;height:12px"></span></div><div class="mt-2"><span class="skel-cell" style="width:100%;height:4px;display:block"></span></div><div class="mt-2"><span class="skel-cell" style="width:50px;height:11px"></span></div></div>
        <div class="chs-card" style="opacity:.4"><div class="chs-top"><span class="skel-cell" style="width:70px;height:12px"></span></div><div class="mt-2"><span class="skel-cell" style="width:100%;height:4px;display:block"></span></div><div class="mt-2"><span class="skel-cell" style="width:50px;height:11px"></span></div></div>
        <div class="chs-card" style="opacity:.4"><div class="chs-top"><span class="skel-cell" style="width:70px;height:12px"></span></div><div class="mt-2"><span class="skel-cell" style="width:100%;height:4px;display:block"></span></div><div class="mt-2"><span class="skel-cell" style="width:50px;height:11px"></span></div></div>
        <div class="chs-card" style="opacity:.4"><div class="chs-top"><span class="skel-cell" style="width:70px;height:12px"></span></div><div class="mt-2"><span class="skel-cell" style="width:100%;height:4px;display:block"></span></div><div class="mt-2"><span class="skel-cell" style="width:50px;height:11px"></span></div></div>
      </div>
    </div>

    <!-- Live Open Positions P&L -->
    <div id="live-pnl-card" class="card shadow-sm mb-3" style="display:none">
      <div class="card-header fw-bold d-flex justify-content-between align-items-center" style="background:#f0fdf4;border-bottom:1px solid #bbf7d0">
        <span><i class="bi bi-activity me-2 text-success"></i>Open Positions — Live P&L</span>
        <span id="live-pnl-updated" class="text-muted" style="font-size:11px;font-weight:400"></span>
      </div>
      <div class="card-body p-0">
        <table class="table table-hover align-middle mb-0" style="font-size:13px">
          <thead class="table-light">
            <tr>
              <th>Symbol</th>
              <th>Qty</th>
              <th>Avg Price</th>
              <th>LTP</th>
              <th>P&L</th>
              <th>P&L %</th>
            </tr>
          </thead>
          <tbody id="live-pnl-body"></tbody>
        </table>
      </div>
    </div>

  </div>
  <!-- Operational Health Footer -->
  <div id="ops-footer"></div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.001.js?v=0.1.0"></script>
  <script src="../assets/js/helpers/upstox-helper.001.js?v=0.1.0"></script>
  <script src="../assets/js/load-client.001.js?v=0.1.0"></script>
  <script src="../assets/js/instrument-search.001.js?v=0.1.0"></script>
  <script src="../assets/js/load-stocks.001.js?v=0.1.0"></script>
  <script src="../assets/js/populate-stocks.001.js?v=0.1.0"></script>
  <script src="../assets/js/refresh-stocks.001.js?v=0.1.0"></script>
  <script src="../assets/js/delete-stocks.001.js?v=0.1.0"></script>
  <script src="../assets/js/buy-controller/upstox-buy.001.js?v=0.1.0"></script>
  <script src="../assets/js/buy-stocks.001.js?v=0.1.0"></script>
  <script src="../assets/js/sell-stocks.001.js?v=0.1.0"></script>
  <script src="../assets/js/dashboard-intelligence.001.js?v=0.1.0"></script>
  <script src="../assets/js/dashboard-clock.001.js?v=0.1.0"></script>
  <script src="../assets/js/dashboard-pnl.001.js?v=0.1.0"></script>
  <script>
    (function () {
      const sidebar = document.getElementById('sidebar');
      if (localStorage.getItem('sidebar-collapsed') === 'true') sidebar.classList.add('collapsed');
      document.getElementById('toggle-btn').addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        localStorage.setItem('sidebar-collapsed', sidebar.classList.contains('collapsed'));
      });
    })();

  </script>
</body>
</html>
