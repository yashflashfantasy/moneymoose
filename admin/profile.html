<script>

const form = document.querySelector('form'); // wrap your inputs in a <form> tag
form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const clientData = {
    fullName: form.querySelector('input[placeholder="Enter full name"]').value,
    phone: form.querySelector('input[placeholder="Enter phone number"]').value,
    broker: form.querySelector('input[placeholder="Enter broker name"]').value,
    username: form.querySelector('input[placeholder="Enter username"]').value,
    password: form.querySelector('input[placeholder="Enter password"]').value,
    tradeLimit: Number(form.querySelector('input[placeholder="Enter trade limit"]').value),
    createdAt: Date.now()
  };

  try {
    await saveClient(clientData);
    showToast('Client saved successfully!', 'success');
    form.reset();
  } catch (err) {
    console.error('Failed to save client:', err);
    showToast('Error saving client.', 'error');
  }
});

async function saveClient(clientData) {
  await openDB();

  return new Promise((resolve, reject) => {
    const transaction = db.transaction(['clients'], 'readwrite');
    const store = transaction.objectStore('clients');

    const request = store.add(clientData);

    request.onsuccess = () => resolve(true);
    request.onerror = (e) => reject(e.target.error);
  });
}
</script>
