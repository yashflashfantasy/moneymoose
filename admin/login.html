<body class="login-page">

<div class="login-card align-items-center justify-content-center">
   <div class="d-flex align-items-center text-center w-100 justify-content-center my-4">
      <a href="index.html" class="logo d-flex align-items-center me-3 text-center">
        <!-- Uncomment the line below if you also wish to use an image logo -->
        <!-- <img src="../assets/img/logo.webp" alt=""> -->
        <img src="../assets/img/logo-icon-1.png" alt="" width="70">
         
        <h1 class="sitename">MoneyMoose</h1>
      </a>
     
    </div>

    <form id="loginForm">
    <div class="mb-3">
      <label class="mb-2">Email</label>
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
        <input type="email" id="email" class="form-control" placeholder="Email Address" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="mb-2">Password</label>
      <div class="mb-2 input-group">
        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
        <input type="password" id="password" class="form-control" placeholder="Password" required>
      </div>
    </div>

    <div class="forgot-link">
      <a href="#">Forgot Password?</a>
    </div>

    <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
  </form>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const toggleBtn = document.getElementById('toggle-btn');
    const sidebar = document.getElementById('sidebar');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });
  </script>
  <!-- JS -->

<script>
  // Static JSON object for login credentials
  const loginData = {
    email: "admin@moneymoose.com",
    password: "123456"
  };

  // Form submit handler
  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault(); // stop page refresh

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    // Check credentials
    if (email === loginData.email && password === loginData.password) {
      // Store login info in localStorage (optional)
      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("userEmail", email);

      // Redirect to dashboard
      window.location.href = "../admin/dashboard.html";
    } else {
      alert("Invalid email or password!");
    }
  });
</script>
