<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Login — MoneyMoose</title>
  <link href="../assets/img/favicon.png" rel="icon">
  <link href="../assets/img/apple-touch-icon.png" rel="apple-touch-icon">
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      padding: 24px;
    }
  </style>
</head>
<body>

  <div class="login-card" style="width:100%">
    <div class="login-logo">
      <img src="../assets/img/logo-icon-1.png" alt="MoneyMoose logo" width="48">
      <h1>MoneyMoose</h1>
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-4">
        <label class="login-label" for="email">Email</label>
        <input type="email" id="email" class="login-input"
          placeholder="admin@moneymoose.com" required autocomplete="username">
      </div>

      <div class="mb-4">
        <label class="login-label" for="password">Password</label>
        <input type="password" id="password" class="login-input"
          placeholder="••••••••" required autocomplete="current-password">
      </div>

      <p id="login-error" class="login-error" role="alert" aria-live="assertive"></p>

      <button type="submit" class="login-btn" id="login-submit">Sign in</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.001.js?v=0.1.0"></script>
  <script>
    // If already logged in, go straight to dashboard
    if (localStorage.getItem('isLoggedIn') === 'true') {
      window.location.replace('dashboard.html');
    }

    const loginData = { email: 'admin@moneymoose.com', password: '123456' };

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl  = document.getElementById('login-error');
      const btn      = document.getElementById('login-submit');

      errorEl.textContent = '';
      btn.textContent     = 'Signing in…';
      btn.disabled        = true;

      if (email !== loginData.email || password !== loginData.password) {
        errorEl.textContent = 'Incorrect email or password.';
        btn.textContent     = 'Sign in';
        btn.disabled        = false;
        document.getElementById('password').focus();
        return;
      }

      // Get a backend session token so API calls are authorised
      try {
        const backendUrl = 'https://wormless-interseptal-melodee.ngrok-free.dev';
        const r    = await fetch(`${backendUrl}/auth/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ password }),
        });
        const data = await r.json();
        if (data.token) localStorage.setItem('mm_token', data.token);
      } catch (err) {
        console.warn('[Login] Backend token fetch failed:', err.message);
      }

      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('userEmail', email);
      window.location.replace('dashboard.html');
    });
  </script>
</body>
</html>
