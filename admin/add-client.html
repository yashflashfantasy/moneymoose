  <script>
// ------------------------------
// Your JSON data (shortened for demo)
// ------------------------------
const response = {
  "success": true,
  "data": {
    "name": "Top 20 by market cap",
    "instruments": [
      { "s": "RELIANCE", "n": "RELIANCE INDUSTRIES LTD" },
      { "s": "TCS", "n": "TATA CONSULTANCY SERV LT" },
      { "s": "HDFCBANK", "n": "HDFC BANK LTD" },
      { "s": "INFY", "n": "INFOSYS LIMITED" },
      { "s": "ITC", "n": "ITC LTD" },
      { "s": "SBIN", "n": "STATE BANK OF INDIA" },
      { "s": "WIPRO", "n": "WIPRO LTD" },
      { "s": "LT", "n": "LARSEN & TOUBRO LTD." },
      { "s": "AXISBANK", "n": "AXIS BANK LIMITED" },
      { "s": "DMART", "n": "AVENUE SUPERMARTS LIMITED" }
    ]
  }
};

// ------------------------------
// Function to generate random numbers for demo
// ------------------------------
function randomPrice(base) {
  return (base + (Math.random() * 2 - 1)).toFixed(2);
}

function randomChange() {
  const val = (Math.random() * 2 - 1).toFixed(2); // -1.00 to +1.00
  const icon = val >= 0
    ? `<i class="fa-solid fa-arrow-up text-success"></i> ${val}%`
    : `<i class="fa-solid fa-arrow-down text-danger"></i> ${val}%`;
  return icon;
}

// ------------------------------
// Populate the table dynamically
// ------------------------------
const tbody = document.getElementById("marketTableBody");
const instrumentsTable = response.data.instruments;

instrumentsTable.forEach(stock => {
  const sell = randomPrice(1000);
  const buy = (parseFloat(sell) + 1).toFixed(2);
  const change = randomChange();

  const row = document.createElement("tr");
  row.innerHTML = `
    <td><input type="checkbox"></td>
    <td>${stock.n}</td>
    <td>${sell}</td>
    <td>${buy}</td>
    <td>${change}</td>
  `;
  tbody.appendChild(row);
});

// ------------------------------
// Select All Checkbox Logic
// ------------------------------
document.getElementById("select-all").addEventListener("change", function() {
  document.querySelectorAll('#marketTableBody input[type="checkbox"]').forEach(cb => {
    cb.checked = this.checked;
  });
});
</script>
<script>
let instruments = [];
let dataLoaded = false;

// ===============================
// Load large JSON file
// ===============================
fetch("complete.json")
  .then(res => res.json())
  .then(data => {
    instruments = data;
    dataLoaded = true;
    document.getElementById('resultsContainer').innerHTML = '<div class="no-results">Start typing to search...</div>';
  })
  .catch(err => {
    console.error("Error loading JSON:", err);
    document.getElementById('resultsContainer').innerHTML = '<div class="no-results text-danger">Failed to load data.</div>';
  });

// ===============================
// Highlight matched text
// ===============================
function highlightText(text, query) {
  const regex = new RegExp(`(${query})`, 'gi');
  return text.replace(regex, '<span class="highlight">$1</span>');
}

// ===============================
// Live Search
// ===============================
const input = document.getElementById('searchInput');
const resultsContainer = document.getElementById('resultsContainer');

input.addEventListener('input', function() {
  const query = this.value.trim().toLowerCase();
  resultsContainer.innerHTML = '';

  if (!dataLoaded) {
    resultsContainer.innerHTML = '<div class="loader">Please wait, loading data...</div>';
    return;
  }

  if (query.length < 2) {
    resultsContainer.innerHTML = `<div class="no-results">Type at least 2 letters...</div>`;
    return;
  }

  // Search efficiently
  const results = instruments.filter(item =>
    (item.name && item.name.toLowerCase().includes(query)) ||
    (item.trading_symbol && item.trading_symbol.toLowerCase().includes(query)) ||
    (item.isin && item.isin.toLowerCase().includes(query)) ||
    (item.exchange && item.exchange.toLowerCase().includes(query))
  );

  if (results.length === 0) {
    resultsContainer.innerHTML = `<div class="no-results">No matches found</div>`;
    return;
  }

  // Show top 30 results for speed
  results.slice(0, 30).forEach(item => {
    const nameHighlighted = highlightText(item.name || 'N/A', query);
    const html = `
      <div class="result-item">
        <strong>${nameHighlighted}</strong>
        <em>${item.segment || 'Unknown'} • ${item.exchange || ''} • ${item.instrument_type || ''}</em>
        ${item.trading_symbol ? `<div><small><b>Symbol:</b> ${item.trading_symbol}</small></div>` : ''}
        ${item.isin ? `<div><small><b>ISIN:</b> ${item.isin}</small></div>` : ''}
      </div>
    `;
    resultsContainer.insertAdjacentHTML('beforeend', html);
  });
});
</script>
