  <script>
    (function () {
      const sidebar = document.getElementById('sidebar');
      if (localStorage.getItem('sidebar-collapsed') === 'true') sidebar.classList.add('collapsed');
      document.getElementById('toggle-btn').addEventListener('click', () => {

  <script>
    let hourlyChart = null;
    let cpeChart    = null;

    function parseOptionType(sym) {
      if (!sym) return '—';
      const u = sym.toUpperCase();
      const m = u.match(/\b(CE|PE)\b/) || u.match(/(CE|PE)$/);
      return m ? m[1] : '—';
    }

    async function initReport() {
      document.getElementById('report-date').textContent = new Date().toLocaleDateString('en-IN', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });

      try {
        const res     = await loadClients();
        const clients = res.data || [];
        const sel     = document.getElementById('clientSelect');
        sel.innerHTML = '<option value="">Select client…</option>';
        clients.forEach(c => {
          const opt       = document.createElement('option');
          opt.value       = c.id;
          opt.textContent = c.client_name;
          sel.appendChild(opt);
        });
        if (clients.length > 0) { sel.value = clients[0].id; loadReport(clients[0].id); }
        sel.addEventListener('change', () => { if (sel.value) loadReport(sel.value); });
      } catch {
        showToast('Failed to load clients', 'error');
      }

      document.getElementById('refresh-report').addEventListener('click', () => {
        const sel = document.getElementById('clientSelect');
        if (sel.value) loadReport(sel.value);
      });
    }

    async function loadReport(clientId) {
      ['stat-ce-buy','stat-pe-buy','stat-ce-exit','stat-pe-exit',
       'stat-pnl','stat-total','stat-complete'].forEach(id => {
        document.getElementById(id).textContent = '…';
      });
      document.getElementById('stat-pnl-sub').textContent = '';
      document.getElementById('empty-state').style.display = 'none';

      const [ordersRes, pnlRes] = await Promise.allSettled([
        getClientOrders(clientId),
        getClientPnl(clientId)
      ]);

      const orders = ordersRes.status === 'fulfilled' ? (ordersRes.value?.data || []) : [];

      const ceBuy  = orders.filter(o => parseOptionType(o.trading_symbol) === 'CE' && o.transaction_type === 'BUY').length;
      const peBuy  = orders.filter(o => parseOptionType(o.trading_symbol) === 'PE' && o.transaction_type === 'BUY').length;
      const ceExit = orders.filter(o => parseOptionType(o.trading_symbol) === 'CE' && o.transaction_type !== 'BUY').length;
      const peExit = orders.filter(o => parseOptionType(o.trading_symbol) === 'PE' && o.transaction_type !== 'BUY').length;
      const complete = orders.filter(o => o.status === 'complete').length;

      document.getElementById('stat-ce-buy').textContent   = ceBuy;
      document.getElementById('stat-pe-buy').textContent   = peBuy;
      document.getElementById('stat-ce-exit').textContent  = ceExit;
      document.getElementById('stat-pe-exit').textContent  = peExit;
      document.getElementById('stat-total').textContent    = orders.length;
      document.getElementById('stat-complete').textContent = complete;

      // P&L
      const pnlEl = document.getElementById('stat-pnl');
      if (pnlRes.status === 'fulfilled' && pnlRes.value?.data) {
        const d   = pnlRes.value.data;
        const val = Number(d.pnl ?? d.total_pnl ?? d.realised ?? 0);
        pnlEl.textContent = (val >= 0 ? '+' : '') + '₹' + Math.abs(val).toLocaleString('en-IN', { minimumFractionDigits: 2 });
        pnlEl.style.color = val >= 0 ? '#27ae60' : '#dc3545';
        if (d.realised != null && d.unrealised != null) {
          document.getElementById('stat-pnl-sub').textContent =
            `Realised ₹${Number(d.realised).toFixed(2)}  ·  Unrealised ₹${Number(d.unrealised).toFixed(2)}`;
        }
      } else {
        pnlEl.textContent = '—';
        pnlEl.style.color = '';
      }

      renderHourlyChart(orders);
      renderCpeChart(ceBuy + ceExit, peBuy + peExit);

      if (orders.length === 0) {
        document.getElementById('charts-row').style.opacity = '0.35';
        document.getElementById('empty-state').style.display = '';
      } else {
        document.getElementById('charts-row').style.opacity = '1';
      }
    }

    function renderHourlyChart(orders) {
      const counts = new Array(24).fill(0);
      orders.forEach(o => {
        if (o.order_timestamp) counts[new Date(o.order_timestamp).getHours()]++;
      });
      const labels = [], data = [];
      for (let h = 9; h <= 16; h++) { labels.push(h + ':00'); data.push(counts[h]); }

      if (hourlyChart) hourlyChart.destroy();
      hourlyChart = new Chart(document.getElementById('hourlyChart'), {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: 'rgba(13,110,253,0.6)',
            borderRadius: 6,
            borderSkipped: false,
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 }, grid: { color: '#f4f4f4' } },
            x: { grid: { display: false } }
          }
        }
      });
    }

    function renderCpeChart(ce, pe) {
      if (cpeChart) cpeChart.destroy();
      cpeChart = new Chart(document.getElementById('cpeChart'), {
        type: 'doughnut',
        data: {
          labels: ['CE', 'PE'],
          datasets: [{
            data: ce + pe === 0 ? [1, 1] : [ce, pe],
            backgroundColor: ce + pe === 0 ? ['#e9ecef', '#e9ecef'] : ['#27ae60', '#e67e22'],
            borderWidth: 0,
            hoverOffset: 6
          }]
        },
        options: {
          responsive: true,
          cutout: '68%',
          plugins: {
            legend: { display: false },
            tooltip: { enabled: ce + pe > 0 }
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initReport);
  </script>
